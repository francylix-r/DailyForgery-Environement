// A shared researcher-entered sample identifier is a provenance join, not a causal inference.
function crossModalMatches(e, analyzer) {

 for(const d of e.datasets||[]){
  const sampleColumn=(d.headers||[]).find(h=>/^(sample|sample[_\s-]?id|label|specimen)$/i.test(h));
  if(!sampleColumn)continue;
  const col=d.selected||d.numeric?.[0];if(!col)continue;
  const analyzed=analyzer(d.records,col);
  for(const rowIndex of analyzed.anomalies){
   const label=String(d.records[rowIndex][sampleColumn]||'').trim();if(!label)continue;
   const sample=(e.samples||[]).find(s=>s.name.trim().toLowerCase()===label.toLowerCase());if(!sample)continue;
   const linkedPhotos=(e.evidence||[]).filter(v=>v.type==='image'&&v.sampleId===sample.id);

  }
 }

}

// Shunting-yard expression calculator with a restricted arithmetic grammar.
function calculate(text){

  if(/^\d|^\./.test(token)) {if(!expecting)throw Error('Missing operator between numbers.');output.push(Number(token));expecting=false;continue;}
  if(token==='('){if(!expecting)throw Error('Missing operator before parenthesis.');stack.push(token);continue;}
  if(token===')'){if(expecting)throw Error('Incomplete expression.');while(stack.length&&stack.at(-1)!=='(')output.push(stack.pop());if(stack.pop()!=='(')throw Error('Mismatched parentheses.');expecting=false;continue;}
  if(expecting){if(token!=='-')throw Error('Operator in unexpected position.');stack.push('u-');continue;}

 }
 if(expecting)throw Error('Incomplete expression.');
 while(stack.length){const op=stack.pop();if(op==='(')throw Error('Mismatched parentheses.');output.push(op);}

rs and everyday users can use the rest of DailForg.'],['Does AI work for free?','Browser tools are free. AI inference depends on a user-supplied provider/model, which may have its own free limits or charges.'],['How does cloud storage work?','Cloud Drives connect through each provider’s authorized OAuth application. Files remain in their storage until you choose to import or upload them.'],['Will DailForg read all my files?','No. You choose which sources can be included in AI requests. Unapproved documents are not sent automatically.'],['What does the ! or ? mean?','Hover or focus the icon to see what a setting or feature actually does.']].map(([q,a])=>`<details class="env-faq"><summary>${q}</summary><p>${a}</p></details>`).join('')}</section>`;}

async function init(){
 document.addEventListener('click',handleClick);document.addEventListener('submit',handleSubmit);document.addEventListener('change',handleChange);document.addEventListener('input',e=>{if(e.target.id==='suite-search'||e.target.id==='suite-atom-search'){const fieldId=e.target.id,pos=e.target.selectionStart;if(fieldId==='suite-search')ui.suite.search=e.target.value;else ui.suite.atomSearch=e.target.value;draw();const field=document.getElementById(fieldId);field?.focus();field?.setSelectionRange(pos,pos);}if(e.target.id==='suite-draw-bg'){ui.suite.background=e.target.value;const canvas=document.getElementById('suite-draw-canvas');if(canvas)canvas.style.backgroundColor=e.target.value;}if(e.target.id==='suite-draw-color')ui.suite.color=e.target.value;if(e.target.id==='suite-draw-width')ui.suite.width=Number(e.target.value);if(e.target.id==='suite-draw-mode')ui.suite.mode=e.target.value;});
 document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&ui.modal){ui.modal='';draw();}});
 // Complete external-storage OAuth before Supabase's code-exchange handler.
 setMailOwner(loadSession()?.user?.id||'guest');
 if(new URLSearchParams(location.search).has('dailforg_mail')){try{const ready=await finishMailRedirect();if(ready){ui.mailProvider='outlook';ui.page='mail';ui.landing=false;}}catch(err){ui.mailError=err.message;ui.mailProvider='outlook';ui.page='mail';ui.landing=false;}}
 if(new URLSearchParams(location.search).has('labforg_provider')){
   try{const provider=await finishStorageRedirect();ui.storageProvider=provider;ui.page='integrations';ui.landing=false;ui.storageFiles=await listStorageFiles(provider);}
   catch(err){ui.storageError=String(err.message||err);ui.page='integrations';ui.landing=false;}
 }
 const params=new URLSearchParams(location.hash.replace(/^#/,''));
 const recovery=params.get('type')==='recovery'&&params.get('access_token');
 if(recovery){saveSession({access_token:params.get('access_token'),refresh_token:params.get('refresh_token'),token_type:'bearer',expires_in:Number(params.get('expires_in')||3600),expires_at:Math.floor(Date.now()/1000)+Number(params.get('expires_in')||3600)});ui.modal='password-reset';ui.landing=false;history.replaceState({},'',location.pathname+'#app');}
 if(location.hash==='#app'||location.search.includes('labforg_auth=')||location.search.includes('code='))ui.landing=false;
 window.addEventListener('hashchange',()=>{if(location.hash==='#app'){ui.landing=false;draw();}});
 draw();
 try{
  if(oauthError()){ui.authError=oauthError();clearCallback();}
  else{const result=await consumeSocialCallback();if(result){const s={...result,expires_at:Math.floor(Date.now()/1000)+result.expires_in};saveSession(s);ui.landing=false;}}
  const user=await getUser();if(user){await hydrateAccount(user);}else{saveSession(null);ui.user=null;ui.profile=null;}
 }catch(err){ui.authError=err.message;saveSession(null);ui.user=null;ui.profile=null;}
 finally{ui.authPending=false;draw();}
}

 if(ui.user&&ui.profile?.onboarding_completed){attachVideo();mountWorkspaceVisuals();}
}

function datasetChooser(e){return `<label class="field-label">DATASET<select id="dataset-select" data-change="select-dataset"><option value="">${e.datasets.length?'Choose a dataset':'No datasets imported'}</option>${e.datasets.map(d=>`<option value="${d.id}" ${ui.datasetId===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select></label>`;}
function getDataset(e){return e?.datasets.find(d=>d.id===ui.datasetId)||e?.datasets[e.datasets.length-1]||null;}
function chartSvg(points,anomalies=[],height=190){const shown=points.slice(0,120),values=shown.map(p=>p.value);if(!values.length)return '';const min=Math.min(...values),max=Math.max(...values),range=max-min||1;const w=680,h=height,pad=27,inner=w-pad*2;const circles=shown.map((p,i)=>{const x=pad+(i/(Math.max(shown.length-1,1)))*inner,y=height-pad-((p.value-min)/range)*(height-pad*2);return `<circle cx="${x}" cy="${y}" r="${anomalies.includes(p.index)?5.5:3.3}" fill="${!p.included?'#778480':anomalies.includes(p.index)?'#f4b87d':'#c3f86c'}" stroke="${anomalies.includes(p.index)?'#faad6b':'none'}" stroke-width="2"><title>Row ${p.index+1}: ${p.value}${!p.included?' (excluded)':''}</title></circle>`;}).join('');const line=shown.map((p,i)=>`${pad+(i/(Math.max(shown.length-1,1)))*inner},${height-pad-((p.value-min)/range)*(height-pad*2)}`).join(' ');return `<svg class="data-chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Data point chart"><path d="M27 12V${h-pad}H${w-10}" fill="none" stroke="currentColor" stroke-opacity=".25"/><path d="M27 ${pad}H${w-10}M27 ${h/2}H${w-10}" fill="none" stroke="currentColor" stroke-opacity=".1" stroke-dasharray="3 7"/><polyline points="${line}" fill="none" stroke="#8bbf6c" stroke-width="2" stroke-opacity=".48"/>${circles}<text x="32" y="16" font-size="12" fill="currentColor" opacity=".6">${round(max)}</text><text x="32" y="${h-37}" font-size="12" fill="currentColor" opacity=".6">${round(min)}</text></svg>`;}
function metric(name,v,unit=''){return `<div class="analysis-metric"><small>${name}</small><strong>${v===null||v===undefined?'—':esc(v)}${unit}</strong></div>`;}
function dataPage(){const e=getExp();if(!e)return noExp();const d=getDataset(e),col=d?.selected||d?.numeric?.[0],a=d?analysis(d.records,col,[]):null;const group=d?sampleGroupStats(d.records,col):[];return `${pageHeading('DATA LAB / 005','Make numbers accountable.','Real CSV parsing and deterministic descriptive statistics. No LLM-generated numbers.',`${Btn(`${icon('upload',15)} IMPORT CSV`,'pick-csv','lime')}`)}${statusLine(e)}<div class="data-top"><div><p class="kicker">DATASETS / ORIGINALS PRESERVED</p><h3>${d?esc(d.name):'Import measurement data'}</h3></div><div class="row-controls">${datasetChooser(e)}${d?`<label class="field-label">NUMERIC COLUMN<select data-change="dataset-column">${d.numeric.map(n=>`<option ${n===col?'selected':''}>${esc(n)}</option>`).join('')}</select></label>`:''}</div></div>${d?`<div class="metric-grid metric-grid-five">${metric('MEASUREMENTS',a.summary.n)}${metric('MEAN',a.summary.mean)}${metric('MEDIAN',a.summary.median)}${metric('SAMPLE SD',a.summary.sd)}${metric('POTENTIAL ANOMALIES',a.anomalies.length)}</div><div class="two-column data-analysis"><section class="panel"><div class="panel-head"><div><p class="kicker">FIG / ${esc(col.toUpperCase())}</p><h3>Measurement signal</h3></div>${badge('DETERMINISTIC','good')}</div>${chartSvg(a.points,a.anomalies)}<div class="chart-legend"><span><i class="dot-lime"></i> Recorded value</span><span><i class="dot-amber"></i> Review candidate</span></div><p class="panel-note">Potential anomalies use median absolute deviation when available, with IQR or z-score fallback. A flag is not grounds for automatic exclusion.</p></section><section class="panel"><div class="panel-head"><div><p class="kicker">QUALITY / REVIEW</p><h3>Analytical checks</h3></div>${Btn('WHAT-IF REPLAY →','go-replay','text')} ${Btn('OPEN REVIEWS →','open-review','text')}</div>${a.anomalies.length?`<div class="finding-list">${a.anomalies.slice(0,12).map(i=>`<div class="finding"><span>${icon('alert',20)}</span><div><b>Potential anomalous value</b><p>Row ${i+2}: ${esc(d.records[i][col])} · Review context before exclusion.</p></div></div>`).join('')}</div>`:`<div class="insight-ok">${icon('check',21)} No values flagged by the current heuristic. This does not establish data validity.</div>`}${group.length?`<p class="kicker" style="margin-top:22px">GROUPED BY SAMPLE</p><div class="group-stats">${group.map(g=>`<div><strong>${esc(g.name)}</strong><span>N ${g.n}</span><span>μ ${g.mean}</span><span>SD ${g.sd??'—'}</span></div>`).join('')}</div>`:''}</section></div><section class="panel" style="margin-top:18px"><div class="panel-head"><div><p class="kicker">SOURCE / IMMUTABLE ORIGINAL</p><h3>Data preview</h3></div>${badge(`${d.records.length} ROWS / ${d.headers.length} COLS`)}</div><div class="table-wrap"><table class="data-table"><thead><tr><th>ROW</th>${d.headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${d.records.slice(0,24).map((r,i)=>`<tr class="${a.anomalies.includes(i)?'row-flagged':''}"><td>${String(i+1).padStart(3,'0')}</td>${d.headers.map(h=>`<td>${esc(r[h])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${d.records.length>24?'<p class="panel-note">Showing the first 24 rows. All imported rows are available for calculations.</p>':''}</section>`:empty('chart','No measurements imported.','Import a CSV with a header row and at least one numeric column to analyze it.','pick-csv','Import CSV')}`;}
function graph(){const e=getExp();if(!e)return noExp();const nodes=[];if(e.protocolText)nodes.push({id:'protocol',type:'source',name:'Source protocol',detail:e.protocolName});e.steps.slice(0,16).forEach(s=>nodes.push({id:s.id,type:'step',name:`STEP ${s.index}`,detail:s.title}));e.samples.slice(0,12).forEach(s=>nodes.push({id:s.id,type:'sample',name:s.name,detail:s.description||'Registered sample'}));e.evidence.slice(0,18).forEach(v=>nodes.push({id:v.id,type:'evidence',name:v.name,detail:`${v.type.toUpperCase()} · ${fmtDate(v.at)}`}));e.datasets.slice(0,8).forEach(d=>nodes.push({id:d.id,type:'dataset',name:d.name,detail:`${d.records.length} CSV rows`}));const selected=nodes.find(n=>n.id===ui.graphNode)||nodes[0];return `${pageHeading('INTELLIGENCE GRAPH / 006','Every claim, a source.','Trace the relationship between protocol steps, samples, raw evidence and measurements.',`${Btn('VIEW NOTEBOOK','go-notebook','outline')}`)}${statusLine(e)}<div class="graph-layout"><section class="panel graph-canvas"><div class="panel-head"><div><p class="kicker">EVIDENCE SYSTEM / INSPECTABLE</p><h3>Research provenance map</h3></div>${badge(`${nodes.length} NODES`)}</div>${nodes.length?`<div class="graph-stages"><div><span class="graph-level-title">01 / METHOD</span>${nodes.filter(n=>['source','step'].includes(n.type)).map(n=>graphNode(n)).join('')||'<small>No method nodes</small>'}</div><div><span class="graph-level-title">02 / OBSERVATION</span>${nodes.filter(n=>['sample','evidence'].includes(n.type)).map(n=>graphNode(n)).join('')||'<small>No observation nodes</small>'}</div><div><span class="graph-level-title">03 / MEASUREMENT</span>${nodes.filter(n=>n.type==='dataset').map(n=>graphNode(n)).join('')||'<small>No data yet</small>'}</div></div>`:empty('nodes','Your graph is waiting for evidence.','Add protocol steps, samples or measurements to build a real provenance network.')}<div class="panel-note">${icon('info',15)} Nodes are actual stored records. Evidence-to-step links are captured at creation; we do not invent scientific causal links.</div></section><section class="panel graph-details"><div class="panel-head"><div><p class="kicker">INSPECTOR / NODE DETAILS</p><h3>Selected evidence</h3></div></div>${selected?`<span class="node-kind">${esc(selected.type.toUpperCase())}</span><h2>${esc(selected.name)}</h2><p>${esc(selected.detail||'No description recorded')}</p><div class="graph-relations"><b>Linked records</b>${linkedNodes(e,selected).length?linkedNodes(e,selected).map(n=>`<button data-act="select-node" data-id="${n.id}">${icon('link',15)} ${esc(n.name)}</button>`).join(''):'<p>No explicit evidence links recorded.</p>'}</div>`:empty('nodes','Select a node.','When evidence is captured, its details appear here.')}</section></div>`;}
function graphNode(n){return `<button class="graph-node node-${n.type} ${ui.graphNode===n.id?'selected':''}" data-act="select-node" data-id="${n.id}"><span>${icon(n.type==='source'?'file':n.type==='step'?'check':n.type==='sample'?'database':n.type==='dataset'?'chart':'eye',16)}</span><div><b>${esc(n.name.slice(0,42))}</b><small>${esc((n.detail||'').slice(0,53))}</small></div>${icon('chevron',13)}</button>`;}
function linkedNodes(e,n){const result=[];const candidate=(a,type,label)=>({id:a.id,name:label||a.name||a.title,type});if(n.type==='step')e.evidence.filter(ev=>ev.stepId===n.id).forEach(ev=>result.push(candidate(ev,'evidence')));if(n.type==='evidence'&&e.steps.some(s=>s.id===e.evidence.find(v=>v.id===n.id)?.stepId)) {const s=e.steps.find(s=>s.id===e.evidence.find(v=>v.id===n.id)?.stepId);result.push(candidate(s,'step',`STEP ${s.index}: ${s.title.slice(0,30)}`));}if(n.type==='sample'){e.evidence.filter(v=>v.sampleId===n.id).forEach(v=>result.push(candidate(v,'evidence')));e.datasets.filter(d=>d.records.some(r=>Object.keys(r).some(k=>/^(sample|sample[_\s-]?id|label)$/i.test(k)&&r[k]===e.samples.find(s=>s.id===n.id)?.name))).forEach(d=>result.push(candidate(d,'dataset')));}
 if(n.type==='evidence'){const s=e.samples.find(s=>s.id===e.evidence.find(v=>v.id===n.id)?.sampleId);if(s)result.push(candidate(s,'sample'));}
 if(n.type==='source')e.steps.slice(0,8).forEach(s=>result.push(candidate(s,'step',`STEP ${s.index}`)));if(n.type==='dataset')e.evidence.filter(v=>v.datasetId===n.id).forEach(ev=>result.push(candidate(ev,'evidence')));return result;}
function replay(){const e=getExp();if(!e)return noExp();const d=getDataset(e),col=d?.selected||d?.numeric?.[0],excluded=(ui.branchExclusions[d?.id]||[]);const original=d?analysis(d.records,col,[]):null,sim=d?analysis(d.records,col,excluded):null;return `${pageHeading('COUNTERFACTUAL LAB / 007','What if we were wrong?','Branch the analysis. Preserve original measurements. Make exclusions explicit.',`${Btn(`${icon('layers',15)} SAVE BRANCH`,'save-branch','lime',!d?'disabled':'')}`)}${statusLine(e)}${d?`<div class="replay-toolbar">${datasetChooser(e)}<div class="replay-note">${icon('shield',16)} Simulations never modify the original CSV.</div></div><div class="replay-columns"><div class="replay-card"><span class="kicker">BRANCH / 00 ORIGINAL</span><h3>Recorded values</h3><div class="replay-big">${original.summary.mean ?? '—'}</div><span class="replay-unit">MEAN / ${esc(col)}</span><div class="replay-details">${metric('N',original.summary.n)}${metric('SD',original.summary.sd)}</div>${chartSvg(original.points,original.anomalies,140)}</div><div class="replay-card replay-alt"><span class="kicker">BRANCH / PREVIEW · NON-DESTRUCTIVE</span><h3>Alternative calculation</h3><div class="replay-big">${sim.summary.mean ?? '—'}</div><span class="replay-unit">MEAN / ${esc(col)}</span><div class="replay-details">${metric('N',sim.summary.n)}${metric('Δ MEAN',original.summary.mean==null||sim.summary.mean==null?null:round(sim.summary.mean-original.summary.mean))}</div>${chartSvg(sim.points,sim.anomalies,140)}</div></div><section class="panel"><div class="panel-head"><div><p class="kicker">BRANCH CONDITIONS</p><h3>Choose observations to exclude in the simulation</h3></div>${Btn('RESET EXCLUSIONS','reset-exclusions','outline small')}</div><div class="exclude-list">${d.records.slice(0,120).map((r,i)=>`<label class="exclude-row"><input type="checkbox" data-change="exclude-row" value="${i}" ${excluded.includes(i)?'checked':''}/><span>ROW ${i+1}</span><strong>${esc(r[col])}</strong>${original.anomalies.includes(i)?badge('FLAGGED','warn'):''}<small>${esc(Object.entries(r).filter(([k])=>k!==col).slice(0,2).map(([k,v])=>`${k}: ${v}`).join(' · '))}</small></label>`).join('')}</div>${d.records.length>120?'<p class="panel-note">For large datasets, this preview provides the first 120 rows. Import a smaller filtered dataset for additional exclusions.</p>':''}</section><section class="panel" style="margin-top:18px"><div class="panel-head"><div><p class="kicker">PERSISTED ANALYTICAL BRANCHES</p><h3>Branch history</h3></div></div>${e.branches.length?e.branches.map(b=>`<div class="branch-history"><div><b>${esc(b.name)}</b><p>${fmtDate(b.at)} · ${esc(b.datasetName)} · Excluded rows: ${b.excluded.map(x=>x+1).join(', ')||'none'}</p></div><span>μ ${b.originalMean} → ${b.alternativeMean}</span></div>`).join(''):empty('layers','No saved branches.','Choose one or more rows and save a simulation for future review.')}</section>`:empty('chart','No dataset available.','Import a CSV in DataLab to begin counterfactual replay.','go-data','Open DataLab')}`;}
function notebook(){const e=getExp();if(!e)return noExp();return `${pageHeading('LAB NOTEBOOK / 008','The evidence remembers.','A chronological, evidence-linked record. Read your report in DailForg or print it as a PDF.',`${Btn(`${icon('file',15)} PRINT / SAVE PDF`,'print-report','lime')}`)}${statusLine(e)}<div class="notebook-layout"><div class="paper-sheet"><div class="paper-header"><span>${logo(27)} DAILFORG / LABORATORY RECORD</span><span>EXP ${esc(e.id.slice(-9).toUpperCase())}</span></div><div class="report-top"><p>RESEARCH REPORT / ${fmtDate(e.createdAt)}</p><h2>${esc(e.name)}</h2><div class="report-meta"><span>STATUS: ${esc(e.status.toUpperCase())}</span><span>PROTOCOL V.${e.protocolVersion||'—'}</span><span>${e.isDemo?'DEMONSTRATION DATA':'RESEARCH DATA'}</span></div></div><div class="report-section"><label>01 / OBJECTIVE</label><p>${esc(e.objective||'No objective recorded.')}</p></div><div class="report-section"><label>01B / RESEARCH DESIGN · ${esc(fieldFor(e.field).name.toUpperCase())}</label>${[['Hypothesis',e.hypothesis],['Method',e.method],['Independent variable',e.independentVariable],['Measured variable',e.dependentVariable],['Controls / confounders',e.controls],['Acceptance criteria',e.successCriteria],['Equipment',e.equipment],['Safety / ethics review status',e.safetyReview]].map(([k,v])=>`<div class="paper-line"><span>${esc(k)}</span><span>${esc(v||'Not documented')}</span></div>`).join('')}</div><div class="report-section"><label>02 / METHOD</label><h4>${esc(e.protocolName||'No protocol attached')}</h4>${e.steps.length?e.steps.map(s=>`<div class="paper-line"><span>${s.index.toString().padStart(2,'0')}</span><span>${esc(s.title)}</span><small>${esc(s.status)}</small></div>`).join(''):'<p>No steps registered.</p>'}</div><div class="report-section"><label>03 / CHRONOLOGICAL EVIDENCE</label>${e.events.map(ev=>`<div class="report-event"><time>${fmtTime(ev.at)}</time><div><strong>${esc(ev.title)}</strong><p>${esc(ev.detail)}</p><small>${esc(ev.source)} async function ingestProtocol(file){if(file.size>10*1024*1024)throw Error('Protocol file exceeds 10 MB.');const e=activeOrWarn();if(!e)return;const text=await readProtocolFile(file);if(e.protocolText){(e.protocolHistory||=[]).push({version:e.protocolVersion||1,name:e.protocolName,text:e.protocolText,at:stamp()});}e.protocolText=text.slice(0,100000);e.protocolName=file.name;e.protocolVersion=(e.protocolVersion||0)+1;e.steps=parseProtocol(e.protocolText);const key=await storeBlob(file,file.name),sha256=await fileSHA256(file).catch(()=>null);e.evidence.push({id:id('ev'),sha256,type:'protocol',name:file.name,mime:file.type,size:file.size,blobKey:key,at:stamp(),stepId:''});log(e,'protocol','Protocol document imported',`${file.name}: ${e.steps.length} draft step(s). These require researcher review.`,'file');persist();uploadEvidenceBackground(e,e.evidence[e.evidence.length-1],file);toast(`Protocol imported — ${e.steps.length} steps extracted for review.`);}

 const v={id:id('ev'),sha256,type:isImage?'image':'file',category,name:file.name,mime:file.type||'application/octet-stream',size:file.size,blobKey:key,at:stamp(),stepId,extractedText:extractedText.slice(0,80000),extractionError,notes:[],aiIncluded:false};

function integrityDesk(){const e=getExp();if(!e)return noExp();const r=readiness(e);return `${pageHeading('INTEGRITY / 014','Trust the record, not the guess.','Review documentation gaps and verify source-file SHA-256 digests without calling them proof of scientific authenticity.',`${Btn(`${icon('shield',16)} CHECK LOCAL FILES`,'verify-files','lime')}`)}${statusLine(e)}<div class="integrity-layout"><section class="panel"><div class="panel-head"><div><p class="kicker">DOCUMENTATION COMPLETENESS</p><h3>Readiness checklist</h3></div>${badge(`${r.passed}/${r.total} CHECKS`,r.passed===r.total?'good':'warn')}</div><div class="integrity-score">${r.percent}<span>%</span></div><p class="settings-hint">This measures presence of documentation, not experimental accuracy, safety or reproducibility.</p><div class="integrity-checks">${r.checks.map(c=>`<button data-act="nav" data-page="${c.url}" class="integrity-check"><span class="${c.pass?'passed':'missing'}">${icon(c.pass?'check':'alert',16)}</span><div>${esc(c.label)}</div>${icon('arrow',15)}</button>`).join('')}</div></section><section class="panel"><div class="panel-head"><div><p class="kicker">BYTE-LEVEL FILE IDENTIFICATION</p><h3>Attachment fingerprints</h3></div>${badge(`${e.evidence.length} FILES`)}</div>${ui.integrityResult?`<p class="integrity-result">${esc(ui.integrityResult)}</p>`:''}${e.evidence.length?e.evidence.map(v=>`<div class="digest-item"><b>${esc(v.name)}</b><small>${prettyBytes(v.size)}</small><code>${esc(v.sha256||'Legacy file — digest unavailable. Run verification to register current local bytes.')}</code></div>`).join(''):empty('shield','No original files yet.','Import a protocol, CSV, photograph or reference file.')}</section></div>`;}
async function verifyFiles(){const e=activeOrWarn();if(!e)return;let match=0,missing=0,changed=0,registered=0,unsupported=0;for(const v of e.evidence){const file=await evidenceBlob(v);if(!file){missing++;continue;}try{const actual=await fileSHA256(file);if(!v.sha256){v.sha256=actual;registered++;}else if(actual===v.sha256)match++;else changed++;}catch{unsupported++;}}ui.integrityResult=`${match} matching digests · ${registered} legacy digests registered · ${missing} missing files · ${unsupported} hashing unavailable · ${changed} digest mismatches`;log(e,'integrity','Local attachment digest check',ui.integrityResult,'deterministic');persist();toast(ui.integrityResult,changed||missing||unsupported?'warn':'ok');}
async function runVisionAudit(evId){const e=activeOrWarn(),v=e?.evidence.find(x=>x.id===evId);if(!v||v.type!=='image')return;if(!aiReady()){toast('Set up an AI provider before structured image inspection.','warn');navigate('settings');return;}const blob=await evidenceBlob(v);if(!blob)return toast('Image is unavailable locally and in private cloud storage.','warn');ui.modal='';toast('Requesting visual audit. Photo will be sent to the configured AI provider.');try{const response=ui.aiProvider==='gemini'?await inspectGeminiEvidence({apiKey:ui.aiKey,model:ui.aiModel,experiment:e,imageBlob:blob,evidenceName:v.name}):await inspectCompatibleEvidence({apiKey:ui.aiKey,model:ui.aiModel,endpoint:ui.aiEndpoint,experiment:e,imageBlob:blob,evidenceName:v.name});const origin={origin:'ai',sourceIds:[v.id,...(v.stepId?[v.stepId]:[]),...(v.sampleId?[v.sampleId]:[])],observations:response.visibleObservations,uncertainties:response.uncertainties,checks:response.suggestedChecks};const findings=response.potentialDiscrepancies.length?response.potentialDiscrepancies:[{title:'Image interpretation requires researcher review',detail:response.summary||'No discrepancy reported, but image interpretation remains unverified.',severity:'info'}];for(const f of findings)(e.findings||=[]).push(newFinding({...origin,title:f.title||'Potential visual inconsistency',detail:f.detail||response.summary,severity:f.severity}));log(e,'ai','Structured image review received',`${findings.length} unverified AI suggestion(s) linked to ${v.name}; researcher resolution required.`,'ai',[v.id]);persist(false);navigate('review');toast('AI suggestions added to researcher review queue. Nothing automatically verified.');}catch(err){toast(`Vision audit failed: ${err.message}`,'warn');}}
function printSampleLabel(e,s){const content=`<!doctype html><html><head><meta charset="utf-8"><title>Sample label</title><style>body{font-family:Arial;background:white;color:#152e23;padding:24px}.label{border:3px solid #152e23;width:340px;padding:20px}.brand{font-size:11px;letter-spacing:3px;font-weight:900}.big{font-size:31px;font-weight:900;margin:20px 0}.mono{font:11px monospace;word-break:break-all}.note{font-size:11px;margin-top:15px}</style></head><body><div class="label"><div class="brand">DAILFORG ENV / SPECIMEN</div><div class="big">${esc(s.name)}</div><div class="mono">SAMPLE ${esc(s.id)}<br>EXPERIMENT ${esc(e.id)}</div><div class="note">Researcher-labeled identifier. Does not establish physical sample identity.</div></div><script>window.print()<\/script></body></html>`;const win=window.open('','_blank');if(!win)return toast('Allow pop-ups for printable labels.','warn');win.document.write(content);win.document.close();}

function profilePage(){const p=ui.profile||{},v=k=>esc(p[k]??'');return `${pageHeading('PERSONAL IDENTITY / 016','My profile.','Your information is stored in your private Supabase profile. Identity, connected environment and preferences.')}
<div class="profile-layout"><section class="panel"><div class="profile-header">${logo(50)}<div><h2>${v('display_name')||esc(ui.user.email)}</h2><p>${esc(ui.user.email)} · ${v('role')}</p></div>${badge('VERIFIED','good')}</div><form class="modal-form" data-form="profile-edit"><div class="form-double"><label>DISPLAY NAME<input name="display_name" required maxlength="90" value="${v('display_name')}"></label><label>USERNAME<input name="username" required maxlength="32" pattern="[a-zA-Z0-9_]{3,32}" value="${v('username')}"></label></div><div class="form-double"><label>ROLE<select name="role">${['student','researcher','educator','technician','professional','other'].map(o=>`<option value="${o}" ${p.role===o?'selected':''}>${o}</option>`).join('')}</select></label><label>EXPERIENCE<select name="experience">${['beginner','intermediate','advanced','professional'].map(o=>`<option value="${o}" ${p.experience===o?'selected':''}>${o}</option>`).join('')}</select></label></div><div class="form-double"><label>WORKSPACE NAME<input name="lab_name" required maxlength="140" value="${v('lab_name')}"></label><label>ORGANIZATION<input name="organization" maxlength="140" value="${v('organization')}"></label></div><div class="form-double"><label>RESEARCH FIELD ${helpTip('Research field')}<input name="field" maxlength="90" value="${v('field')}"></label><label>COUNTRY<input name="country" maxlength="80" value="${v('country')}"></label></div><label>TIMEZONE<input name="timezone" maxlength="90" value="${v('timezone')}"></label><label>RESEARCH GOAL<textarea name="goal" rows="3" maxlength="1000">${v('goal')}</textarea></label><label>BIOGRAPHY<textarea name="biography" rows="3" maxlength="1000">${v('biography')}</textarea></label><label>RESEARCHER TITLE<input name="researcher_title" maxlength="120" value="${v('researcher_title')}" placeholder="e.g. Research assistant"></label><label>DEPARTMENT<input name="department" maxlength="150" value="${v('department')}"></label><div class="form-double"><label>ORCID IDENTIFIER<input name="orcid" maxlength="19" value="${v('orcid')}" placeholder="0000-0000-0000-0000"></label><label>WEBSITE<input name="website" type="url" maxlength="300" value="${v('website')}" placeholder="https://..."></label></div><label>RESEARCH INTERESTS<input name="research_interests" maxlength="500" value="${v('research_interests')}" placeholder="e.g. Genomics, bioinformatics"></label><div class="form-double"><label>LANGUAGE<select name="preferred_language">${['en','fr','ar','es'].map(t=>`<option value="${t}" ${p.preferred_language===t?'selected':''}>${({en:'English',fr:'Français',ar:'العربية',es:'Español'})[t]}</option>`).join('')}</select></label><label>ALERT DIGEST<select name="notification_digest">${['none','weekly','monthly'].map(t=>`<option value="${t}" ${p.notification_digest===t?'selected':''}>${t.toUpperCase()}</option>`).join('')}</select></label></div><label>MEASUREMENT UNITS<select name="preferred_units"><option value="SI" ${p.preferred_units==='SI'?'selected':''}>SI / metric</option><option value="mixed" ${p.preferred_units==='mixed'?'selected':''}>Mixed</option></select></label><label class="check-label"><input type="checkbox" name="communications_email" ${p.communications_email?'checked':''}> Keep email communications preference enabled (does not subscribe you to any service)</label><button type="submit" class="btn btn-lime">SAVE PROFILE ${icon('arrow',15)}</button></form></section><section class="panel"><p class="kicker">ACCOUNT SECURITY</p><h3>Your identities</h3>${(ui.identities||[]).map(i=>`<div class="profile-identity">${esc(i.provider)} ${badge('LINKED','good')}</div>`).join('')||'<p>No external provider data returned.</p>'}<p class="settings-hint">Your username and field are not shared publicly by this application. Connections are only considered linked when returned by Supabase Auth.</p>${Btn('VIEW CONNECTIONS','nav','outline','data-page="integrations"')}${Btn('SIGN OUT','signout','ghost')}</section></div>`;}
function summaryForShare(){const e=getExp();if(!e)return 'DailForg Env — scientific experiment workspace';const n=e.datasets?.length||0,steps=e.steps?.length||0,done=e.steps?.filter(s=>s.status==='complete').length||0;return `DailForg Env experiment: ${e.name}\nObjective: ${e.objective||'Not specified'}\nProgress: ${done}/${steps} researcher-confirmed steps\nDatasets: ${n}\nReview findings: ${(e.findings||[]).length}\nGenerated by DailForg Env. Source files and complete evidence remain in the laboratory workspace; this is a summary only.`;}
async function saveConnectionAction(service){try{if(service!=='github')return;const repo=String($('#share-repo')?.value||'').trim();if(repo&&!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repo))throw Error('Repository must be owner/repo.');await upsertConnection(ui.user.id,'github',{repo});ui.connections=await listConnections();toast('Connection preference saved in Supabase.');draw();}catch(e){toast(e.message,'warn');}}
async function performShare(channel){const user=ui.user,e=getExp(),recipient=String($('#share-recipient')?.value||'').trim(),text=summaryForShare(),subject=e?`DailForg Env — ${e.name}`:'DailForg Env';let url=null;
 if(channel==='clipboard'){try{await navigator.clipboard.writeText(text);toast('Experiment summary copied.');}catch{toast('Clipboard unavailable here. Use HTTPS/localhost.','warn');return;}}
 else if(channel==='gmail'){url=`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(recipient.includes('@')?recipient:'')}&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(text)}`;}
 else if(channel==='outlook'){url=`https://outlook.live.com/mail/0/deeplink/compose?to=${encodeURIComponent(recipient.includes('@')?recipient:'')}&subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(text)}`;}
 else if(channel==='email'){url=`mailto:${encodeURIComponent(recipient.includes('@')?recipient:'')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(text)}`;}
 else if(channel==='whatsapp'){const phone=recipient.replace(/[^0-9]/g,'');url=`https://wa.me/${phone}?text=${encodeURIComponent(text)}`;}
 else if(channel==='sms'){const phone=recipient.replace(/[^+0-9]/g,'');url=`sms:${phone}?&body=${encodeURIComponent(text)}`;}
 else if(channel==='calendar'){const date=new Date(Date.now()+86400000),start=date.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');const end=new Date(date.getTime()+3600000).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');url=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent('DailForg experiment follow-up: '+(e?.name||'research'))}&details=${encodeURIComponent(text)}&dates=${encodeURIComponent(start+'/'+end)}`;}
 else if(channel==='github'){const saved=ui.connections.find(v=>v.service==='github')?.settings?.repo||'';const repo=String($('#share-repo')?.value||saved).trim();if(!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repo))return toast('Enter a valid GitHub owner/repo first.','warn');url=`https://github.com/${repo}/issues/new?title=${encodeURIComponent(subject)}&body=${encodeURIComponent(text)}`;}
 if(url){const opened=window.open(url,'_blank','noopener,noreferrer');if(!opened&&/^https?:/.test(url))location.href=url;}
 if(user&&['gmail','email','whatsapp','sms','outlook','calendar','clipboard','github'].includes(channel))recordShare(user.id,e?.id,channel,recipient?'recipient provided':'').catch(err=>console.warn('Share audit failed:',err.message));
}

init();

</script>
</body>
</html>
